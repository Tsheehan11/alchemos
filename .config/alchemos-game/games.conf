# AlchemOS combat mode — extra game windows, one per line.
# Each line is a regex matched against the whole window class (case-insensitive);
# find a window's class with:  hyprctl clients | grep class
# Built in already: steam_app_<id> (every Steam/Proton game) and gamescope.

# Windows games under Wine/Proton outside Steam (Heroic, Lutris, Faugus…)
.*\.exe

# Examples — remove the # to use:
# heroic                 # the Heroic launcher itself
# net\.lutris\.Lutris    # the Lutris launcher itself
# Minecraft.*
# org\.prismlauncher\..*
