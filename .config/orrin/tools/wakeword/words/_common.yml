# Shared settings for tools/wakeword/pipeline.py (merged under each words/<word>.yml; the word file wins).
# n_*: clips gen_clips.py renders per folder. rounds_*: augmentation passes per split in augment.py
# (each pass = a fresh random room + background + gain, so 3 rounds = 3 different versions of every clip).
n_positive_train: 60000
n_positive_test: 4000
n_negative_train: 40000
n_negative_test: 4000
rounds_positive_train: 3
rounds_negative_train: 2
rounds_test: 1
# Kokoro voices that get extra weight (his picks; also the personas' own voices)
favourite_voices: ["bm_george", "af_nicole"]
favourite_share: 0.25           # of the Kokoro clips
kokoro_share: 0.35              # of all clips (the rest: piper LibriTTS-R, 904 speakers)
pitch_range: 0.08               # ± resample factor (≈ ±1.3 semitones, shifts formants with it)
# openWakeWord train.py (train stage only; generation/augmentation are ours)
n_samples: 60000
n_samples_val: 4000
tts_batch_size: 50
augmentation_batch_size: 16
augmentation_rounds: 1
piper_sample_generator_path: "{W}/piper-sample-generator"
output_dir: "{W}/out"
rir_paths: ["{W}/data/rir"]
background_paths: ["{W}/data/background"]
background_paths_duplication_rate: [1]
false_positive_validation_data_path: "{W}/data/validation_set_features.npy"
feature_data_files:
  ACAV100M: "{W}/data/acav100m_full.npy"
batch_n_per_class:
  ACAV100M: 1024
  adversarial_negative: 80
  positive: 80
model_type: dnn
layer_size: 96
steps: 120000
max_negative_weight: 500    # 1500 → hey_orrin 31 % recall at 0 false/h (too cautious); 500 → 41 % at 0.19 (2026-11-08)
target_false_positives_per_hour: 0.3
