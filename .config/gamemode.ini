; gamemode settings (see /usr/share/gamemode/gamemode.ini for every option).
; Only the hooks are set here; everything else keeps gamemode's defaults.

[custom]
; STARK OS combat mode — second trigger next to the window watcher.
; Safe to fire together with it: stark-game merges triggers under a lock.
start=/home/trevors/.local/bin/stark-game gamemode-start
end=/home/trevors/.local/bin/stark-game gamemode-end
