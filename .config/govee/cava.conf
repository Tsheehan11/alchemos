# cava config used only by stark-govee for music sync (raw numbers to stdout)
[general]
framerate = 30
bars = 15
autosens = 1
sleep_timer = 0
lower_cutoff_freq = 40
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 25
