# STARK OS — kitty
# Colors and opacity come from stark-theme.conf, generated by the quickshell HUD
# (Settings → APPEARANCE). Theme changes reload open windows via SIGUSR1.

font_family      JetBrainsMono Nerd Font

# ── Hologram look ───────────────────────────────
window_padding_width 10
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 3

hide_window_decorations yes
confirm_os_window_close 0

# Solid by default; TERMINAL GLASS in Settings sets background_opacity in the theme file
background_opacity 1.0
dynamic_background_opacity yes

# Keep last so the theme wins
include stark-theme.conf

# Remote control, for Jarvis reading a window's text only. Requests need the password from the keyring
# (jarvis-rc-password.sh), and that password may only run get-text over the socket (jarvis-rc-check.py).
# The socket is in $XDG_RUNTIME_DIR (0700, this user only). Takes effect in kittys started after this.
allow_remote_control password
listen_on unix:${XDG_RUNTIME_DIR}/kitty-rc-{kitty_pid}
geninclude jarvis-rc-password.sh
