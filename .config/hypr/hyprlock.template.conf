# Lock screen (hyprlock)
# Template: the HUD (Theme.qml) fills in the theme colors and the monitors, and writes
# hyprlock.conf from this file whenever either changes.
# Each monitor's background is a picture of its own shut doors (the skin's lock scene), so the lock
# screen lines up exactly with them. The clock and password sit on the main screen
# (__MAIN__), inside its emblem; the others show just their doors.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = holo, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, holo
    # No fade-out: while the session is locked Hyprland draws only black under hyprlock,
    # so fading out showed black (or the desktop) before the doors. The background is
    # a picture of the shut doors, so a hard cut onto the real doors is seamless.
    animation = fadeOut, 0
    animation = inputFieldDots, 1, 2, holo
    animation = inputFieldWidth, 1, 4, holo
    animation = inputFieldColors, 1, 5, holo
}

# Password OR fingerprint (fingerprint needs fprintd + an enrolled finger)
auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = __FP_READY__
    fingerprint:present_message = __FP_PRESENT__
    fingerprint:retry_delay = 250
}

# One background per monitor: stark-lock-bg-<NAME>.png (plus a plain one underneath for a
# monitor plugged in while locked)
__BACKGROUNDS__

# Top door
label {
    monitor = __MAIN__
    text = __LOCKTITLE__
    color = rgb(4fd8ff)
    font_size = 14
    font_family = __FONT_LABEL__
    position = 0, __Y_TITLE__
    halign = center
    valign = center
}

# Clock inside the emblem
label {
    monitor = __MAIN__
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(e8faff)
    font_size = 40
    font_family = __FONT_NUMERIC__
    position = 0, __Y_CLOCK__
    halign = center
    valign = center
}
label {
    monitor = __MAIN__
    text = cmd[update:60000] date +"%a · %d %b" | tr a-z A-Z
    color = rgb(ffb347)
    font_size = 10
    font_family = __FONT_LABEL__
    position = 0, __Y_DATE__
    halign = center
    valign = center
}

# Bottom door: password
input-field {
    monitor = __MAIN__
    size = 340, 50
    outline_thickness = 2
    outer_color = rgba(4fd8ffcc)
    inner_color = rgba(05090fee)
    font_color = rgb(e8faff)
    check_color = rgba(ffb347ff)
    fail_color = rgba(ff5f5fff)
    fail_text = __DENIED__
    placeholder_text = <span foreground="##8fb4c4">__LOCKPROMPT__</span>
    font_family = __FONT_FIELD__
    fade_on_empty = false
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.45
    position = 0, __Y_FIELD__
    halign = center
    valign = center
}

label {
    monitor = __MAIN__
    text = $FPRINTPROMPT
    color = rgba(ffb347cc)
    font_size = 10
    font_family = __FONT_LABEL__
    position = 0, __Y_PROMPT__
    halign = center
    valign = center
}

# Battery (laptop)
label {
    monitor = __MAIN__
    text = cmd[update:30000] echo "BAT $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = rgb(8fb4c4)
    font_size = 11
    font_family = __FONT_NUMERIC__
    position = __BATTERY_POS__
    halign = right
    valign = bottom
}
