# AlchemOS: /etc/systemd/logind.conf.d/alchemos.conf
# HandlePowerKey=ignore: the power key opens the HUD's power menu instead (hypr/alchemos/binds.lua).
# HoldoffTimeoutSec=5s: logind ignores the lid for 5 s after waking (default 30 s);
# lid.sh suspends by itself in that window.
[Login]
HandlePowerKey=ignore
HoldoffTimeoutSec=5s
