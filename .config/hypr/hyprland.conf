# ─────────────────────────────────────────────
#  STARK OS — Hyprland config (STARK OS)
#  Trevor's Inspiron 16 7640 + 2x 1440p monitors
# ─────────────────────────────────────────────

# ── Monitors ─────────────────────────────────
# Matched by model + serial number, so it doesn't matter which USB-C port
# names the dock hands out (DP-5, DP-7, …).
# If left and middle are ever backwards: swap the two serials below.
$leftMon  = desc:Acer Technologies MGB270U P2 16220214A4B00
$midMon   = desc:Acer Technologies MGB270U P2 1622022294B00

monitor = $leftMon,  2560x1440@144, 0x0,      1
monitor = $midMon,   2560x1440@144, 2560x0,   1
monitor = eDP-1,     1920x1200@60,  5120x120, 1
# Any other screen (projector, TV): auto-place to the right
monitor = , preferred, auto, 1

# Workspaces: 1–3 left, 4–6 middle, 7–9 laptop (when docked)
workspace = 1, monitor:$leftMon, default:true
workspace = 2, monitor:$leftMon
workspace = 3, monitor:$leftMon
workspace = 4, monitor:$midMon, default:true
workspace = 5, monitor:$midMon
workspace = 6, monitor:$midMon
workspace = 7, monitor:eDP-1, default:true
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1

# ── Programs ─────────────────────────────────
$terminal = kitty
$files    = dolphin
$browser  = zen-browser
$menu     = fuzzel   # old plain launcher, still on Super + Shift + R

# ── Autostart ────────────────────────────────
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = qs
exec-once = [workspace special:music silent] spotify-launcher

# ── Environment ──────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

# ── Look: hologram cyan ──────────────────────
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 2
    col.active_border   = rgba(4fd8ffee) rgba(4fd8ff55) 45deg
    col.inactive_border = rgba(4fd8ff22)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 4
    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 22
        render_power = 2
        color = rgba(4fd8ff40)
        color_inactive = rgba(00000000)
    }
}

animations {
    enabled = true
    bezier = holo, 0.16, 1, 0.3, 1
    bezier = flick, 0.7, 0, 0.3, 1
    animation = windows,     1, 5, holo, popin 85%
    animation = windowsOut,  1, 4, flick, popin 70%
    animation = border,      1, 8, default
    animation = borderangle, 1, 60, default, loop
    animation = fade,        1, 4, default
    animation = workspaces,  1, 5, holo, slidefade 15%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(05090f)
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Keybinds ─────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, qs ipc call launcher toggle   # molecule launcher
bind = $mod, R,      exec, qs ipc call search toggle     # app search
bind = $mod, C,      exec, qs ipc call control toggle    # control center
bind = $mod, comma,  exec, qs ipc call settings toggle   # settings
bind = $mod, M,      togglespecialworkspace, music       # show/hide Spotify
bind = $mod SHIFT, R, exec, $menu
bind = $mod, E,      exec, $files
bind = $mod, B,      exec, $browser
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
bind = $mod, L, exec, qs ipc call stark lock || ~/.config/hypr/stark-lock.sh
bind = $mod SHIFT, M, exit

# Move focus / windows with arrows
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces 1–9 (go to / send window to)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse: Super + drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume, brightness, media keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -q set 5%+ && qs ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && qs ipc call osd brightness
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bind = $mod, Tab, exec, qs ipc call overview toggle
bind = $mod, Escape, exec, qs ipc call stark menu
bindl = , XF86PowerOff, exec, qs ipc call stark menu
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/lid.sh
windowrule = match:class .*, suppress_event maximize
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Saved by Settings → Display
source = ~/.config/hypr/monitors.conf
bind = SUPER, P, exec, qs ipc call settings display

misc {
    anr_missed_pings = 6
}

exec-once = ~/.config/hypr/stark-audio-auto.sh
