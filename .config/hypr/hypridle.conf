# STARK OS — idle & sleep. Generated by Settings → System; edits here get overwritten.

general {
    lock_cmd = ~/.config/hypr/stark-lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/stark-dpms.sh on
    ignore_dbus_inhibit = false
    inhibit_sleep = 3          # don't sleep until the lock screen is really up
}

listener {
    timeout = 600
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/stark-dpms.sh off
    on-resume = ~/.config/hypr/stark-dpms.sh on
}

listener {
    timeout = 1800
    on-timeout = ~/.local/bin/stark-govee suspend
}
