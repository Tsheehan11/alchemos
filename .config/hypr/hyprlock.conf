# STARK OS — lock screen (hyprlock)
# Template: the HUD fills in the theme colors and writes hyprlock.conf from this file.
# The background is a snapshot of the shut security doors, so the lock screen
# lines up exactly with the lock animation. The clock sits inside the emblem.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = holo, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, holo
    animation = fadeOut, 1, 3, holo
    animation = inputFieldDots, 1, 2, holo
    animation = inputFieldWidth, 1, 4, holo
    animation = inputFieldColors, 1, 5, holo
}

background {
    monitor =
    path = /home/trevors/.config/hypr/stark-lock-bg.png
    color = rgb(05090f)
}

# Top door
label {
    monitor =
    text = STARK OS // SECURE
    color = rgb(4fd8ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 290
    halign = center
    valign = center
}

# Clock inside the emblem
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(e8faff)
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = 0, 16
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%a · %d %b" | tr a-z A-Z
    color = rgb(ffb347)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -34
    halign = center
    valign = center
}

# Bottom door: password
input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    outer_color = rgba(4fd8ffcc)
    inner_color = rgba(05090fee)
    font_color = rgb(e8faff)
    check_color = rgba(ffb347ff)
    fail_color = rgba(ff5f5fff)
    fail_text = ACCESS DENIED
    placeholder_text = <span foreground="##8fb4c4">ENTER PASSPHRASE</span>
    fade_on_empty = false
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.45
    position = 0, -280
    halign = center
    valign = center
}

label {
    monitor =
    text = AUTHENTICATION REQUIRED
    color = rgba(ffb347cc)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -335
    halign = center
    valign = center
}

# Battery (laptop)
label {
    monitor =
    text = cmd[update:30000] echo "BAT $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = rgb(8fb4c4)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -30, 20
    halign = right
    valign = bottom
}
